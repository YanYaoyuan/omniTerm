name: Feature request
description: Propose an improvement to omniTerm
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap and existing issues before opening a new request.
        omniTerm is an early-stage project; desktop terminal features are still being developed.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and target operating systems.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
