name: Bug report
description: Report a problem with omniTerm
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove credentials, hostnames, and personal data from logs.
        Report security vulnerabilities privately using the Security tab.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, omniTerm commit/version, and relevant tool versions.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Agent / Codex
        - Local shell
        - SSH / port forwarding
        - SFTP
        - Serial
        - Installation / documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal reproduction with sensitive values removed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
