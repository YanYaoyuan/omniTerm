# omniTerm CI; upstream Codex workflows are archived in ../upstream-workflows/.
name: omniTerm CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniterm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-cli:
    name: CLI / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the omniTerm launcher
        run: node --test omniterm-cli/test/cli.test.js
      - name: Check the command entry point
        run: node omniterm-cli/bin/omniterm.js --help
