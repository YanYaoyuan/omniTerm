# omniTerm CI; upstream Codex workflows are archived in ../upstream-workflows/.
name: omniTerm CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniterm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-cli:
    name: CLI / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the omniTerm launcher
        run: node --test omniterm-cli/test/cli.test.js
      - name: Check the command entry point
        run: node omniterm-cli/bin/omniterm.js --help

  desktop:
    name: Desktop code / ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: omniterm-desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: omniterm-desktop/package-lock.json
      - name: Install desktop dependencies without native or Electron setup
        run: npm ci --ignore-scripts
      - name: Test desktop backend with a mocked terminal host
        run: npm test
      - name: Build desktop main process and renderer
        run: npm run build

  gui:
    name: Desktop window / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: omniterm-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: omniterm-desktop/package-lock.json
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install a virtual display and Electron's libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1
      - name: Install desktop dependencies
        run: npm ci
      - name: Build the desktop and terminal host
        run: npm run build && npm run build:native
      - name: Exercise the real window
        env:
          OMNITERM_GUI_ARTIFACTS: ${{ runner.temp }}/gui
          OMNITERM_TERMINAL_HOST: ${{ github.workspace }}/dist/terminal-host/omniterm-terminal-host
        run: xvfb-run -a -s "-screen 0 1440x940x24" node scripts/test-gui.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-window-screenshots
          path: ${{ runner.temp }}/gui
          if-no-files-found: ignore

  terminal-host:
    name: Terminal host / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: omniterm-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install zsh and sshd for the readiness tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh openssh-server
      - name: Test sessions, screen model and operation broker
        run: cargo test --locked --manifest-path native/terminal-host/Cargo.toml
      - name: Build the terminal host
        run: node scripts/build-native.mjs
      - name: Exercise a real PTY through the host
        run: node scripts/test-pty.mjs
      - name: Exercise approved execution over real SSH with injected latency
        if: runner.os != 'Windows'
        run: node scripts/test-ssh.mjs

  native-app:
    name: Native app / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: omniterm-native
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
      - name: Install window-system libraries, software Vulkan and CJK fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor1 libxrandr2 libxi6 libx11-xcb1 libvulkan1 mesa-vulkan-drivers xvfb fonts-noto-cjk fonts-dejavu-core
      - name: Unit tests (emulation, input, layout, quads, atlas)
        run: cargo test --locked
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the release app
        run: cargo build --release --locked
      - name: Measure emulation throughput and frame building
        run: target/release/omniterm-app --bench 32 | tee bench-${{ runner.os }}.json
      # A real window on a GPU adapter (lavapipe on Linux, WARP on Windows): a shell starts,
      # runs a command, its output reaches the screen, and a screenshot is saved.
      - name: Open the window and run a command in a real shell (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" target/release/omniterm-app --smoke "$PWD/smoke-Linux.png"
      - name: Open the window and run a command in a real shell (Windows)
        if: runner.os == 'Windows'
        run: target/release/omniterm-app.exe --smoke "$PWD/smoke-Windows.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-app-${{ runner.os }}
          path: |
            omniterm-native/smoke-*.png
            omniterm-native/bench-*.json
            omniterm-native/target/release/omniterm-app
            omniterm-native/target/release/omniterm-app.exe
          if-no-files-found: ignore

  engine:
    name: Agent engine / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rust-src
          rustup default 1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: omniterm-engine-cargo-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Test provider protocols and configuration
        run: cargo test --locked -p codex-api -p codex-model-provider-info -p codex-features -p codex-config
      - name: Test the dynamic-tools-only boundary
        run: cargo test --locked -p codex-core --lib dynamic_tools_only
      - name: Check the app-server binary
        run: cargo check --locked -p codex-cli
