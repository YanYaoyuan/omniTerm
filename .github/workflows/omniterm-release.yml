name: Stage verified v0.1.0 draft assets
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  stage-draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4a4eae04a9c6337e0221b3932ee13ad11d302ef
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the successful exact-source build and an unpublished draft
        run: |
          gh api repos/$GH_REPO/actions/runs/41403634867 > "$RUNNER_TEMP/source-run.json"
          gh release view v0.1.0 --repo "$GH_REPO" --json isDraft,targetCommitish,tagName > "$RUNNER_TEMP/draft.json"
          python - <<'PY'
          import json,os,pathlib
          temporary=pathlib.Path(os.environ['RUNNER_TEMP'])
          run=json.loads((temporary/'source-run.json').read_text())
          draft=json.loads((temporary/'draft.json').read_text())
          sha='c4a4eae04a9c6337e0221b3932ee13ad11d302ef'
          assert run['conclusion']=='success' and run['head_sha']==sha
          assert run['repository']['full_name']==os.environ['GH_REPO']
          assert draft['isDraft'] is True and draft['targetCommitish']==sha and draft['tagName']=='v0.1.0'
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41403634867'
          name: omniterm-complete-release-c4a4eae04a9c6337e0221b3932ee13ad11d302ef
          path: dist/release
      - name: Verify the complete artifact set against its exact source
        run: python scripts/release/validate-release.py dist/release
      - name: Attach assets without publishing or replacing existing assets
        run: gh release upload v0.1.0 dist/release/* --repo "$GH_REPO"
      - name: Verify every uploaded asset digest and retain draft state
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python - <<'PY'
          import hashlib,json,os,pathlib
          releases=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'releases.json').read_text())
          release=next(x for x in releases if x['tag_name']=='v0.1.0')
          assert release['draft'] is True
          assert release['target_commitish']=='c4a4eae04a9c6337e0221b3932ee13ad11d302ef'
          assets={x['name']:x for x in release['assets']}
          files=list(pathlib.Path('dist/release').iterdir())
          assert set(assets)=={x.name for x in files}
          for file in files:
              with file.open('rb') as stream: checksum=hashlib.file_digest(stream,'sha256').hexdigest()
              assert assets[file.name]['size']==file.stat().st_size
              assert assets[file.name]['digest']=='sha256:'+checksum
          print(f'All {len(files)} draft assets verified; release remains unpublished.')
          PY
