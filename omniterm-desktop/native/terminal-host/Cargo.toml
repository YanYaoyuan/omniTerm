[package]
name = "omniterm-terminal-host"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "PTY sessions, terminal screen model and Agent operation broker for omniTerm Desktop"
publish = false

# Built on its own: the desktop must not need the whole Agent workspace to get a terminal.
[workspace]

[dependencies]
portable-pty = "0.9.0"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"
